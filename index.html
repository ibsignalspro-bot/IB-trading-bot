<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IB SIGNALS PRO</title>

<style>

/* ===== BODY ===== */
body{
  margin:0;
  font-family:Arial, sans-serif;
  text-align:center;
  background:#0f172a;
  color:white;
}

/* ===== LOGIN SCREEN ===== */
#loginScreen{
  position:fixed;
  width:100%;
  height:100vh;
  background:rgba(0,0,0,0.6); /* transparent background */
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

#loginScreen input{
  padding:12px 40px 12px 12px; /* space for eye icon */
  border-radius:8px;
  border:none;
  margin:10px;
  width:230px;
  font-size:16px;
}

#loginScreen button{
  padding:10px 25px;
  border:none;
  border-radius:8px;
  background:red;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

#loginScreen button:hover{
  transform:scale(1.05);
}

#loginError{
  color:#ef4444;
  display:none;
}

/* Eye Icon */
.eyeIcon{
  position:absolute;
  right:calc(50% - 115px); /* align inside input */
  top:calc(50% - 12px);
  cursor:pointer;
  color:white;
  font-size:18px;
}

/* ===== MAIN CONTENT ===== */
#mainContent{ display:none; }

header{ padding:25px 10px; }

.logo{
  width:120px;
  height:120px;
  margin:0 auto 15px;
  border-radius:50%;
  box-shadow:0 0 20px #38bdf8;
}

/* ===== Animated Heading ONLY ===== */
h1{
  font-size:32px;
  letter-spacing:2px;
  color:#38bdf8;
  animation:glowText 2s ease-in-out infinite alternate;
}

@keyframes glowText{
  from{ text-shadow:0 0 5px #38bdf8; }
  to{ text-shadow:0 0 20px #0ea5e9, 0 0 40px #38bdf8; }
}

/* Controls */
.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:15px;
  gap:10px;
}

select{
  padding:10px;
  border-radius:8px;
  border:none;
  font-size:14px;
  background:#334155;
  color:white;
}

/* Analyze Button */
#analyzeBtn{
  width:360px;
  padding:14px 0;
  font-size:18px;
  font-weight:bold;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:red;
  color:white;
  margin-top:15px;
  transition:0.3s;
}

#analyzeBtn:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px red;
}

#loading{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
  display:none;
}

/* Signal Box */
#signalBox{
  margin:25px auto 10px auto;
  width:300px;
  height:130px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:900;
  background:#0f172a;
  border:4px solid #38bdf8;
  opacity:0;
  transition:0.4s ease;
}

.up{
  color:#22c55e;
  border-color:#22c55e;
  box-shadow:0 0 25px #22c55e;
}

.down{
  color:#ef4444;
  border-color:#ef4444;
  box-shadow:0 0 25px #ef4444;
}

#brokerInfo{
  margin-top:10px;
  font-weight:bold;
  font-size:16px;
}

#countdown{
  margin:12px auto;
  width:80%;
  height:12px;
  background:#334155;
  border-radius:10px;
  overflow:hidden;
}

#progress{
  height:100%;
  width:0%;
  background:#38bdf8;
}

</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <h2>🔐 ENTER PASSWORD</h2>
  <div style="position:relative;">
    <input type="password" id="passwordInput" placeholder="Enter Password">
    <span class="eyeIcon" onclick="togglePassword()">👁️</span>
  </div>
  <button onclick="checkPassword()">LOGIN</button>
  <p id="loginError">Wrong Password!</p>
</div>

<!-- MAIN WEBSITE -->
<div id="mainContent">

<header>
<img src="https://i.postimg.cc/PJmgyPrG/file-00000000b81c72068fdd76155da74af6.png" class="logo">
<h1>IB SIGNALS PRO</h1>
</header>

<div class="controls">

<select id="broker">
<option>Quotex</option>
<option>Pocket Option</option>
<option>Binomo</option>
<option>Olympic Trade</option>
</select>

<select id="pair">
<option>EUR/USD (OTC)</option>
<option>USD/PKR (OTC)</option>
<option>USD/BRL (OTC)</option>
<option>USD/BDT (OTC)</option>
<option>USD/DZD (OTC)</option>
<option>USD/INR (OTC)</option>
<option>USD/EGP (OTC)</option>
<option>USD/PHP (OTC)</option>
<option>USD/COP (OTC)</option>
<option>USD/NGN (OTC)</option>
<option>USD/JPY (OTC)</option>
<option>USD/MXN (OTC)</option>
<option>USD/ARS (OTC)</option>
</select>

<select id="duration">
<option>5s</option>
<option>10s</option>
<option>15s</option>
<option>30s</option>
<option>1m</option>
<option>2m</option>
<option>5m</option>
</select>

</div>

<button id="analyzeBtn" onclick="generateSignal()">Analyze Market</button>
<div id="loading">Analysing...</div>

<div id="signalBox">---</div>
<div id="brokerInfo"></div>

<div id="countdown">
<div id="progress"></div>
</div>

</div>

<script>

/* PASSWORD */
const correctPassword = "IBACCURATEE";

function checkPassword(){
  const input = document.getElementById("passwordInput").value;
  if(input === correctPassword){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("mainContent").style.display="block";
  } else {
    document.getElementById("loginError").style.display="block";
  }
}

/* Toggle password visibility */
function togglePassword(){
  const input=document.getElementById("passwordInput");
  input.type = input.type === "password" ? "text" : "password";
}

/* SIGNAL SYSTEM */
let cooldown=false;

function parseDuration(duration){
  if(duration.endsWith('s')) return parseInt(duration);
  if(duration.endsWith('m')) return parseInt(duration)*60;
  return 15;
}

function generateSignal(){
  if(cooldown){ alert("Wait for trade to finish."); return; }

  const broker=document.getElementById("broker").value;
  const pair=document.getElementById("pair").value;
  const durationStr=document.getElementById("duration").value;
  const totalSeconds=parseDuration(durationStr);

  document.getElementById("brokerInfo").innerHTML=
    "Broker: "+broker+" | Pair: "+pair+" | Time: "+durationStr;

  document.getElementById("loading").style.display="block";

  const box=document.getElementById("signalBox");
  box.style.opacity=0;
  document.getElementById("progress").style.width="0%";

  const analyzeDelay=3000+Math.random()*1000;

  setTimeout(()=>{
    const signal=Math.random()>0.5?"UP":"DOWN";
    box.innerHTML="Signal: "+signal;
    box.className=signal.toLowerCase();
    box.style.opacity=1;

    document.getElementById("loading").style.display="none";

    cooldown=true;

    const startTime=Date.now();
    const progressBar=document.getElementById("progress");

    let interval=setInterval(()=>{
      let elapsed=(Date.now()-startTime)/1000;
      let percent=Math.min((elapsed/totalSeconds)*100,100);
      progressBar.style.width=percent+"%";

      if(elapsed>=totalSeconds){
        clearInterval(interval);
        cooldown=false;
        progressBar.style.width="0%";
        box.style.opacity=0;
      }
    },50);

  },analyzeDelay);
}

</script>

</body>
</html>
